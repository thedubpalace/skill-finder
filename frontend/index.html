<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>skill-finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      /* --- Color system (OKLCH) --- */
      --color-bg:            oklch(14% 0.012 248);
      --color-surface:       oklch(19% 0.014 248);
      --color-surface-2:     oklch(23% 0.013 248);
      --color-border:        oklch(30% 0.014 248);
      --color-border-focus:  oklch(55% 0.160 75);

      --color-text:          oklch(90% 0.010 248);
      --color-text-muted:    oklch(60% 0.010 248);
      --color-text-faint:    oklch(45% 0.010 248);

      --color-accent:        oklch(75% 0.155 75);
      --color-accent-dim:    oklch(62% 0.130 75);
      --color-accent-glow:   oklch(75% 0.155 75 / 15%);

      --color-source-github:      oklch(68% 0.120 310);
      --color-source-marketplace: oklch(65% 0.140 185);
      --color-source-web:         oklch(68% 0.110 145);
      --color-source-hn:          oklch(72% 0.150 55);
      --color-source-npm:         oklch(60% 0.180 25);
      --color-source-pypi:        oklch(65% 0.140 250);
      --color-source-reddit:      oklch(65% 0.180 35);
      --color-source-youtube:     oklch(58% 0.200 20);

      --color-score-high:    oklch(72% 0.150 145);
      --color-score-mid:     oklch(75% 0.155 75);
      --color-score-low:     oklch(60% 0.010 248);

      --color-error:         oklch(62% 0.200 25);
      --color-error-bg:      oklch(18% 0.030 25);

      /* --- Typography --- */
      --sans-font: "Inter", system-ui, sans-serif;
      --mono-font: "JetBrains Mono", ui-monospace, monospace;

      --text-xs:   11px;
      --text-sm:   13px;
      --text-base: 15px;
      --text-lg:   17px;
      --text-xl:   20px;

      /* --- Spacing (4px base) --- */
      --space-1:  4px;
      --space-2:  8px;
      --space-3:  12px;
      --space-4:  16px;
      --space-5:  20px;
      --space-6:  24px;
      --space-8:  32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;

      /* --- Easing --- */
      --ease-out:    cubic-bezier(0.0, 0, 0.2, 1);
      --ease-in:     cubic-bezier(0.4, 0, 1, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--sans-font);
      font-size: var(--text-base);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    /* ===================== Header ===================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 0 var(--space-6);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    .wordmark {
      font-family: var(--mono-font);
      font-size: var(--text-base);
      color: var(--color-accent);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    .wordmark:hover { color: var(--color-accent-dim); }
    .header-spacer { flex: 1; }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-faint);
      transition: background-color 200ms var(--ease-out);
    }
    .status-dot.online  { background: var(--color-score-high); }
    .status-dot.offline { background: var(--color-error); }
    .status-label {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      font-family: var(--mono-font);
    }

    /* Admin trigger + popover */
    .admin-wrap { position: relative; }
    .admin-trigger {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--color-text-muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: background-color 120ms var(--ease-out), border-color 120ms var(--ease-out);
    }
    .admin-trigger:hover { background: var(--color-surface-2); border-color: var(--color-border); }

    .admin-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 240px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 8px 24px oklch(0% 0 0 / 30%);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      transform-origin: top right;
      animation: popover-in 150ms var(--ease-out);
    }
    .admin-panel[hidden] { display: none; }
    @keyframes popover-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    .admin-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--color-accent);
      color: oklch(20% 0.02 248);
      border: none;
      border-radius: 6px;
      font-family: var(--sans-font);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      transition: background-color 120ms var(--ease-out), opacity 150ms var(--ease-out);
    }
    .admin-btn:hover:not(:disabled) { background: var(--color-accent-dim); }
    .admin-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .admin-stat {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      font-family: var(--mono-font);
    }

    /* ===================== Layout ===================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .layout {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      padding: var(--space-6);
    }

    /* ===================== Search area ===================== */
    .search-area { width: 100%; }
    .page-title {
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-2);
    }
    .page-sub {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-5);
    }
    .search-bar {
      display: flex;
      gap: var(--space-2);
    }
    #search-input {
      flex: 1;
      height: 48px;
      font-family: var(--mono-font);
      font-size: var(--text-lg);
      padding: 0 var(--space-4);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text);
      transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
    }
    #search-input::placeholder { color: var(--color-text-faint); }
    #search-input:focus {
      outline: none;
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px var(--color-accent-glow);
    }
    #search-input:disabled { opacity: 0.7; cursor: not-allowed; }

    #search-btn {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out), opacity 150ms var(--ease-out);
    }
    #search-btn.active {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: oklch(20% 0.02 248);
    }
    #search-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #search-btn svg { width: 20px; height: 20px; }

    /* StatusLine — reserve 32px to avoid layout shift */
    .status-line {
      min-height: 32px;
      display: flex;
      align-items: center;
      margin-top: var(--space-3);
      font-size: var(--text-sm);
    }
    .status-line.loading { color: var(--color-text-faint); }
    .status-line.results { color: var(--color-text-muted); }
    .status-line.empty   { color: var(--color-text-muted); }
    .status-line.error {
      color: var(--color-error);
      background: var(--color-error-bg);
      border-radius: 6px;
      padding: var(--space-2) var(--space-4);
    }
    .status-line.idle { display: none; }

    /* Filter bar placeholder (Phase 2) */
    #filter-bar { display: none; }

    /* ===================== Sections ===================== */
    .section-head {
      margin-bottom: var(--space-6);
      display: flex;
      align-items: baseline;
      gap: var(--space-3);
    }
    .section-head h2 {
      font-size: var(--text-lg);
      font-weight: 500;
    }
    .section-head .head-note {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      font-style: italic;
    }

    .card-list { display: flex; flex-direction: column; gap: var(--space-3); }

    /* ===================== SkillCard ===================== */
    .skill-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: var(--space-4) var(--space-5);
      transition: background-color 120ms var(--ease-out);
    }
    .skill-card:hover { background: var(--color-surface-2); }
    .card-appear {
      opacity: 0;
      transform: translateY(8px);
      animation: card-in 200ms var(--ease-out) forwards;
      animation-delay: var(--stagger-delay, 0ms);
    }
    @keyframes card-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 var(--space-2);
      border-radius: 10px;
      font-family: var(--mono-font);
      font-size: var(--text-xs);
      color: var(--color-bg);
      font-weight: 500;
      white-space: nowrap;
    }
    .source-badge.github      { background: var(--color-source-github); }
    .source-badge.marketplace { background: var(--color-source-marketplace); }
    .source-badge.web         { background: var(--color-source-web); }
    .source-badge.hn          { background: var(--color-source-hn); }
    .source-badge.npm         { background: var(--color-source-npm); }
    .source-badge.pypi        { background: var(--color-source-pypi); }
    .source-badge.reddit      { background: var(--color-source-reddit); }
    .source-badge.youtube     { background: var(--color-source-youtube); }

    .score-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-left: auto;
    }
    .score-bar {
      width: 80px;
      height: 3px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
    }
    .score-fill { height: 100%; border-radius: 2px; }
    .score-pct {
      font-family: var(--mono-font);
      font-size: var(--text-sm);
      min-width: 38px;
      text-align: right;
    }

    .card-name {
      display: block;
      font-size: var(--text-lg);
      font-weight: 500;
      font-family: var(--mono-font);
      color: var(--color-accent);
      text-decoration: none;
      margin-bottom: var(--space-2);
      word-break: break-word;
    }
    .card-name:hover { color: var(--color-accent-dim); text-decoration: underline; }

    .card-description {
      font-size: var(--text-base);
      color: var(--color-text-muted);
      max-width: 70ch;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: var(--space-3);
    }
    .card-description.empty { font-style: italic; color: var(--color-text-faint); }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
    }
    .tag {
      font-family: var(--mono-font);
      font-size: var(--text-xs);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--color-text-muted);
    }
    .tag-overflow { color: var(--color-text-faint); align-self: center; font-size: var(--text-xs); font-family: var(--mono-font); }

    /* ===================== RecoCard ===================== */
    .reco-panel { width: 100%; }
    .reco-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .reco-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: var(--space-3) var(--space-4);
      transition: background-color 120ms var(--ease-out);
    }
    .reco-card:hover { background: var(--color-surface-2); }
    .reco-top {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-1);
    }
    .reco-score {
      margin-left: auto;
      font-family: var(--mono-font);
      font-size: var(--text-xs);
    }
    .reco-name {
      display: block;
      font-size: var(--text-base);
      font-weight: 500;
      font-family: var(--mono-font);
      color: var(--color-accent);
      text-decoration: none;
      margin-bottom: var(--space-1);
      word-break: break-word;
    }
    .reco-name:hover { color: var(--color-accent-dim); text-decoration: underline; }
    .reco-desc {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      color: var(--color-text-faint);
      font-size: var(--text-sm);
      padding: var(--space-6) var(--space-4);
    }

    /* ===================== Skeleton ===================== */
    .skeleton-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: var(--space-3) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        var(--color-surface-2) 25%,
        var(--color-border)    50%,
        var(--color-surface-2) 75%
      );
      background-size: 200%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.med   { width: 70%; }
    @keyframes shimmer {
      from { background-position: 200% center; }
      to   { background-position: -200% center; }
    }

    /* ===================== Toast ===================== */
    .toast-stack {
      position: fixed;
      bottom: var(--space-6);
      right: var(--space-6);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .toast {
      max-width: 320px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-left-width: 4px;
      border-radius: 8px;
      padding: var(--space-4);
      box-shadow: 0 8px 24px oklch(0% 0 0 / 30%);
      font-size: var(--text-sm);
      color: var(--color-text);
      animation: toast-in 250ms var(--ease-spring);
    }
    .toast.success { border-left-color: var(--color-score-high); }
    .toast.error   { border-left-color: var(--color-error); }
    .toast.out { animation: toast-out 200ms var(--ease-in) forwards; }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(8px); }
    }

    /* ===================== Sidebar scrollbar ===================== */
    .reco-panel { scrollbar-width: thin; scrollbar-color: var(--color-border) transparent; }
    .reco-panel::-webkit-scrollbar { width: 6px; }
    .reco-panel::-webkit-scrollbar-track { background: transparent; }
    .reco-panel::-webkit-scrollbar-thumb { background: var(--color-surface-2); border-radius: 3px; }

    /* ===================== Responsive ===================== */
    @media (min-width: 960px) {
      .layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        grid-template-rows: auto 1fr;
        gap: var(--space-8);
        padding: var(--space-8) var(--space-6);
        align-items: start;
      }
      .search-area     { grid-column: 1 / -1; }
      .results-section { grid-column: 1; grid-row: 2; }
      .reco-panel {
        grid-column: 2;
        grid-row: 2;
        position: sticky;
        top: 72px;
        max-height: calc(100vh - 96px);
        overflow-y: auto;
      }
    }

    @media (min-width: 640px) and (max-width: 959px) {
      .reco-list {
        flex-direction: row;
        overflow-x: auto;
        gap: var(--space-3);
        padding-bottom: var(--space-2);
        scrollbar-width: thin;
      }
      .reco-card { min-width: 240px; flex-shrink: 0; }
    }

    @media (max-width: 639px) {
      .reco-list {
        flex-direction: row;
        overflow-x: auto;
        gap: var(--space-3);
        padding-bottom: var(--space-2);
      }
      .reco-card { min-width: 220px; flex-shrink: 0; }
      .header { padding: 0 var(--space-4); }
      .layout { padding: var(--space-4); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .card-appear { opacity: 1; transform: none; }
      .skeleton-line { animation: none; background: var(--color-surface-2); }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="wordmark" href="/">skill-finder</a>
    <div class="header-spacer"></div>
    <div class="status-indicator">
      <span id="health-dot" class="status-dot" title="system status"></span>
      <span id="health-label" class="status-label">…</span>
    </div>
    <div class="admin-wrap">
      <button id="admin-trigger" class="admin-trigger" aria-label="admin menu" aria-haspopup="true" aria-expanded="false">···</button>
      <div id="admin-panel" class="admin-panel" hidden>
        <button id="refresh-btn" class="admin-btn">
          <span id="refresh-label">Refresh catalog</span>
        </button>
        <div id="admin-stat" class="admin-stat">Skills in DB: —</div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="layout">
      <section class="search-area">
        <h1 class="page-title">ค้นหา skill</h1>
        <p class="page-sub">พิมพ์ลักษณะของ skill ที่อยากได้เป็นภาษาธรรมชาติ — ระบบค้นหาด้วย semantic search</p>
        <div class="search-bar">
          <input
            id="search-input"
            type="text"
            autocomplete="off"
            placeholder="ค้นหา skill เช่น อ่าน PDF, รันโค้ด Python, web scraping..."
            autofocus />
          <button id="search-btn" aria-label="search">
            <svg id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
        <div id="filter-bar"></div>
        <div id="status-line" class="status-line idle" role="status" aria-live="polite"></div>
      </section>

      <section class="results-section">
        <div class="section-head">
          <h2 id="results-title">ผลการค้นหา</h2>
        </div>
        <div id="results" class="card-list" aria-busy="false"></div>
      </section>

      <aside class="reco-panel">
        <div class="section-head">
          <h2>แนะนำสำหรับคุณ</h2>
          <span class="head-note">จากประวัติของคุณ</span>
        </div>
        <div id="recommendations" class="reco-list"></div>
      </aside>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack"></div>

  <script>
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const els = {
      input:        document.getElementById('search-input'),
      btn:          document.getElementById('search-btn'),
      icon:         document.getElementById('search-icon'),
      statusLine:   document.getElementById('status-line'),
      results:      document.getElementById('results'),
      resultsTitle: document.getElementById('results-title'),
      recos:        document.getElementById('recommendations'),
      healthDot:    document.getElementById('health-dot'),
      healthLabel:  document.getElementById('health-label'),
      adminTrigger: document.getElementById('admin-trigger'),
      adminPanel:   document.getElementById('admin-panel'),
      refreshBtn:   document.getElementById('refresh-btn'),
      refreshLabel: document.getElementById('refresh-label'),
      adminStat:    document.getElementById('admin-stat'),
      toastStack:   document.getElementById('toast-stack'),
    };

    let hasSearched = false;

    // ---------- helpers ----------
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function scoreColorVar(score) {
      if (score >= 0.80) return '--color-score-high';
      if (score >= 0.50) return '--color-score-mid';
      return '--color-text-faint';
    }

    function sourceClass(source) {
      return ['github', 'marketplace', 'web'].includes(source) ? source : 'web';
    }

    function setStatus(state, text) {
      els.statusLine.className = 'status-line ' + state;
      els.statusLine.textContent = text || '';
    }

    function spinnerSvg() {
      els.icon.innerHTML =
        '<circle cx="12" cy="12" r="9" stroke-opacity="0.25"></circle>' +
        '<path d="M21 12a9 9 0 0 0-9-9"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></path>';
    }
    function arrowSvg() {
      els.icon.innerHTML =
        '<line x1="5" y1="12" x2="19" y2="12"></line>' +
        '<polyline points="12 5 19 12 12 19"></polyline>';
    }

    function applyBtnActive() {
      els.btn.classList.toggle('active', els.input.value.trim().length > 0);
    }
    els.input.addEventListener('input', applyBtnActive);

    // ---------- rendering ----------
    function skillCardHtml(item, i) {
      const score = Number(item.score) || 0;
      const pct = Math.round(score * 100);
      const colorVar = scoreColorVar(score);
      const src = sourceClass(item.source);
      const tags = (item.tags || []).filter(Boolean);
      const shown = tags.slice(0, 5);
      const overflow = tags.length - shown.length;

      const tagsHtml = shown.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('') +
        (overflow > 0 ? `<span class="tag-overflow">+${overflow}</span>` : '');

      const descClass = item.description ? 'card-description' : 'card-description empty';
      const descText = item.description ? escapeHtml(item.description) : 'ไม่มีคำอธิบาย';

      const name = item.source_url
        ? `<a class="card-name" href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener">${escapeHtml(item.name)}</a>`
        : `<span class="card-name">${escapeHtml(item.name)}</span>`;

      const delay = REDUCED_MOTION ? 0 : Math.min(i * 30, 150);

      return `<article class="skill-card card-appear" style="--stagger-delay:${delay}ms">
        <div class="card-top">
          <span class="source-badge ${src}">${escapeHtml(item.source || 'web')}</span>
          <div class="score-wrap">
            <span class="score-bar"><span class="score-fill" style="width:${pct}%;background:var(${colorVar})"></span></span>
            <span class="score-pct" style="color:var(${colorVar})">${pct}%</span>
          </div>
        </div>
        ${name}
        <p class="${descClass}">${descText}</p>
        ${tags.length ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      </article>`;
    }

    function recoCardHtml(item) {
      const score = Number(item.score) || 0;
      const pct = Math.round(score * 100);
      const colorVar = scoreColorVar(score);
      const src = sourceClass(item.source);
      const name = item.source_url
        ? `<a class="reco-name" href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener">${escapeHtml(item.name)}</a>`
        : `<span class="reco-name">${escapeHtml(item.name)}</span>`;
      const desc = item.description
        ? `<p class="reco-desc">${escapeHtml(item.description)}</p>`
        : '';
      return `<article class="reco-card">
        <div class="reco-top">
          <span class="source-badge ${src}">${escapeHtml(item.source || 'web')}</span>
          <span class="reco-score" style="color:var(${colorVar})">${pct}%</span>
        </div>
        ${name}
        ${desc}
      </article>`;
    }

    function renderResults(items, query) {
      const count = items.length;
      els.resultsTitle.textContent = `ผลการค้นหา${count ? ` (${count})` : ''}`;
      if (!count) {
        els.results.innerHTML = '<div class="empty-state">ไม่พบ skill ที่ตรงกัน — ลองคำอื่น?</div>';
        return;
      }
      els.results.innerHTML = items.map((it, i) => skillCardHtml(it, i)).join('');
    }

    function renderRecommendations(items) {
      if (!items || !items.length) {
        els.recos.innerHTML = '<div class="empty-state">ยังไม่มีประวัติการค้นหา — ลองค้นหาครั้งแรก</div>';
        return;
      }
      els.recos.innerHTML = items.map(recoCardHtml).join('');
    }

    function recoSkeleton(n = 3) {
      els.recos.innerHTML = Array.from({ length: n }).map(() =>
        `<div class="skeleton-card">
          <div class="skeleton-line short"></div>
          <div class="skeleton-line med"></div>
          <div class="skeleton-line"></div>
        </div>`).join('');
    }

    // ---------- search ----------
    async function doSearch() {
      const q = els.input.value.trim();
      if (!q) return;

      hasSearched = true;
      els.input.disabled = true;
      els.btn.disabled = true;
      els.results.setAttribute('aria-busy', 'true');
      spinnerSvg();
      setStatus('loading', 'กำลังค้นหา…');

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&top_k=10`);
        if (!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();

        renderResults(data.results || [], q);
        renderRecommendations(data.recommendations || []);

        if ((data.results || []).length) {
          setStatus('results', `พบ ${data.results.length} ผลลัพธ์ สำหรับ "${q}"`);
        } else {
          setStatus('empty', 'ไม่พบ skill ที่ตรงกัน — ลองคำอื่น?');
        }
      } catch (e) {
        setStatus('error', `เกิดข้อผิดพลาด: ${e.message}`);
      } finally {
        els.input.disabled = false;
        els.btn.disabled = false;
        els.results.setAttribute('aria-busy', 'false');
        arrowSvg();
        els.input.focus();
      }
    }

    els.input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    els.btn.addEventListener('click', doSearch);

    // ---------- recommendations (initial load) ----------
    async function loadRecommendations() {
      let skeletonTimer = setTimeout(() => recoSkeleton(3), 200);
      try {
        const res = await fetch('/api/recommendations');
        clearTimeout(skeletonTimer);
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderRecommendations(data);
      } catch (_) {
        clearTimeout(skeletonTimer);
        renderRecommendations([]);
      }
    }

    // ---------- health ----------
    async function checkHealth() {
      try {
        const res = await fetch('/health', { cache: 'no-store' });
        const ok = res.ok && (await res.json()).status === 'ok';
        els.healthDot.className = 'status-dot ' + (ok ? 'online' : 'offline');
        els.healthLabel.textContent = ok ? 'online' : 'offline';
      } catch (_) {
        els.healthDot.className = 'status-dot offline';
        els.healthLabel.textContent = 'offline';
      }
    }

    // ---------- toast ----------
    function toast(type, message) {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      els.toastStack.appendChild(el);
      setTimeout(() => {
        el.classList.add('out');
        setTimeout(() => el.remove(), 220);
      }, 4000);
    }

    // ---------- admin panel ----------
    function toggleAdmin(open) {
      const willOpen = open ?? els.adminPanel.hidden;
      els.adminPanel.hidden = !willOpen;
      els.adminTrigger.setAttribute('aria-expanded', String(willOpen));
    }
    els.adminTrigger.addEventListener('click', e => { e.stopPropagation(); toggleAdmin(); });
    document.addEventListener('click', e => {
      if (!els.adminPanel.hidden && !els.adminPanel.contains(e.target) && e.target !== els.adminTrigger) {
        toggleAdmin(false);
      }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleAdmin(false); });

    async function refreshCatalog() {
      els.refreshBtn.disabled = true;
      els.refreshLabel.textContent = 'กำลัง crawl…';
      try {
        await fetch('/admin/crawl', { method: 'POST' });
        // crawl returns immediately (background task) — give it a moment before rebuild
        await new Promise(r => setTimeout(r, 2000));
        const res = await fetch('/admin/rebuild-index', { method: 'POST' });
        if (!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();
        els.adminStat.textContent = `Skills in DB: ${data.skill_count}`;
        toast('success', `Catalog rebuilt — ${data.skill_count} skills indexed`);
        toggleAdmin(false);
        loadRecommendations();
      } catch (e) {
        toast('error', `Refresh ล้มเหลว: ${e.message}`);
      } finally {
        els.refreshBtn.disabled = false;
        els.refreshLabel.textContent = 'Refresh catalog';
      }
    }
    els.refreshBtn.addEventListener('click', refreshCatalog);

    // ---------- boot ----------
    applyBtnActive();
    loadRecommendations();
    checkHealth();
    setInterval(checkHealth, 30000);
    els.input.focus();
  </script>
</body>
</html>
